name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit & DOM tests
        run: npm run test

      - name: Build, package, and verify efficiency budgets
        run: npm run budgets

      - name: Install Playwright Chromium for E2E
        run: npx playwright-core install chromium

      - name: Run browser E2E smoke tests
        run: npm run test:e2e

      - name: Upload packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: snappy-form-filler-packages
          path: artifacts/*

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Snappy Form Filler icon">
  <defs>
    <linearGradient id="bgGrad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Squircle badge with luminous rim for dark-toolbar visibility and rich body for light toolbars -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#34d399" stroke-width="3" />

  <!-- Subtle top highlight for depth at 48px-512px -->
  <path d="M34 10 H94 C108 10 118 20 118 34 V38 C118 24 108 14 94 14 H34 C20 14 10 24 10 38 V34 C10 20 20 10 34 10 Z" fill="#ffffff" fill-opacity="0.18" />

  <!-- Form field 1 (top bar) -->
  <rect x="24" y="29" width="54" height="16" rx="8" fill="#ffffff" />

  <!-- Form field 2 (middle bar) -->
  <rect x="24" y="55" width="42" height="16" rx="8" fill="#ffffff" fill-opacity="0.92" />

  <!-- Form field 3 (bottom filled checkbox + bar) -->
  <rect x="24" y="81" width="18" height="18" rx="6" fill="#ffffff" fill-opacity="0.92" />
  <path d="M29.5 90 L33 93.5 L38.5 86.5" fill="none" stroke="#047857" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Snappy lightning bolt with crisp dark-emerald separation stroke -->
  <path
    d="M90 22 L62 66 H81 L70 106 L106 58 H86 Z"
    fill="#064e3b"
    stroke="#064e3b"
    stroke-width="10"
    stroke-linejoin="round"
  />
  <path
    d="M90 22 L62 66 H81 L70 106 L106 58 H86 Z"
    fill="url(#boltGrad)"
  />
</svg>
